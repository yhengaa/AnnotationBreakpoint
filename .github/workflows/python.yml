name: Python bridge checks

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "docs/PYTHON.md"
      - "README.md"
      - ".github/workflows/python.yml"
      - "SHA256SUMS"
  pull_request:
    paths:
      - "python/**"
      - "docs/PYTHON.md"
      - "README.md"
      - ".github/workflows/python.yml"
      - "SHA256SUMS"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel:
    name: Python ${{ matrix.python-version }} / installed R engine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      R_BIOC_VERSION: "3.21"
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::BiocManager
          needs: check
          cache-version: 2

      - name: Install unchanged R engine
        shell: bash
        run: R CMD INSTALL .

      - name: Build and install Python distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir python/dist python
          python -m pip install python/dist/*.whl

      - name: Run focused Python tests
        shell: bash
        run: python -m unittest discover -s python/tests -p 'test_*.py'

      - name: Run installed tiny edgeR parity
        shell: bash
        env:
          ANNOTATION_BREAKPOINT_RUN_INTEGRATION: "1"
        run: python -m unittest discover -s python/tests -p 'test_installed_integration.py'

      - uses: actions/upload-artifact@v4
        with:
          name: annotation-breakpoint-python-${{ matrix.python-version }}
          path: python/dist/*
