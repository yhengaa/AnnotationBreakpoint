name: Publish AnnotationBreakpoint 0.2.0
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.2.0.yml']
permissions: {}
concurrency:
  group: publish-annotation-breakpoint-v0.2.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the approved package without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/git/blobs/640497e5acca329beb2beff2de5f129eb96e3317" --jq .content | base64 --decode > AnnotationBreakpoint_0.2.0.tar.gz
          printf '%s  %s\n' '17e57844e6c8abad4147032bf87e1d3d0d0e03776f5226e5992be56eba0d04d3' 'AnnotationBreakpoint_0.2.0.tar.gz' > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat > RELEASE_NOTES.md <<'AB_RELEASE_NOTES'
          # AnnotationBreakpoint 0.2.0
          
          AnnotationBreakpoint is an R software utility for testing whether a predeclared donor-level expression-effect claim remains above a fixed threshold under allowed cell-label reassignments.
          
          Version 0.2.0 makes `proxy_prefix` the default search method. This is the accepted Method B procedure: cells are ranked once from the observed annotation using a finite donor-logCPM proxy, cumulative prefixes of sizes 1, 2, 4, 8, 16, 32, 64, and 128 are evaluated without reranking; an inadmissible exact prefix is rejected rather than repaired or filled with lower-ranked cells. Each evaluated assignment receives a full authoritative refit. Reported witnesses are independently replayed.
          
          Saved COMBAT CD4.TCM examples retain the original 0.5 effect threshold, global 445-cell/5% limit, and donor-level constraints:
          
          - FAM118A: verified upper bound 64 label changes; fitted effect 0.8106752561679119 to 0.4731965904097605.
          - PDXK: verified upper bound 32 label changes; fitted effect 0.7274641768393035 to 0.3373883736018561.
          
          These costs are verified upper bounds, not certified minima. Crossing 0.5 concerns the specified fitted expression effect; it does not establish a change in statistical significance or biological truth.
          
          The registered comparator study dropped the claim of a unique search-method contribution: Method B found a witness in 13/13 registered cases and canonical greedy in 11/13, with zero canonical-only discoveries and no cost advantage of two or more cells for canonical greedy. The negative Hao result and the inconclusive scaling and public-utility conclusions remain part of the published evidence. This release adds no new scientific result.
          
          Install the source package with:
          
          ```sh
          R CMD INSTALL AnnotationBreakpoint_0.2.0.tar.gz
          ```
          
          Verify the download with the accompanying `SHA256SUMS` file.
          AB_RELEASE_NOTES
          gh release create v0.2.0 AnnotationBreakpoint_0.2.0.tar.gz SHA256SUMS --repo "$GH_REPO" --target d6d277f4e24b7f66f6dc20a6a2a0afb2bec7838e --title 'AnnotationBreakpoint 0.2.0' --notes-file RELEASE_NOTES.md --draft
          gh release edit v0.2.0 --repo "$GH_REPO" --draft=false --latest
