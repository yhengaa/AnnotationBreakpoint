name: Update 0.2.0 release documentation
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/update-v0.2.0-description.yml']
permissions: {}
jobs:
  update-description:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Update the existing release description only
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases/tags/v0.2.0" --jq .id)" = '411278090'
          cat > RELEASE_BODY.md <<'AB_RELEASE_DESCRIPTION'
          AnnotationBreakpoint 0.2.0 is an R utility for testing how sensitive a predeclared donor-level expression-effect claim is to allowed cell-type label reassignments.
          
          ### What is included
          
          - `proxy_prefix` is the default practical search: it ranks permitted changes once with the observed-centered finite donor-logCPM proxy, fully refits cumulative prefixes of sizes 1, 2, 4, 8, 16, 32, 64, and 128 subject to the caller's fit and time limits, rejects inadmissible exact prefixes rather than repairing them, and independently replays the smallest evaluated prefix that crosses the threshold and passes replay.
          - Exact enumeration remains available for small finite domains. Explicit `random`, `greedy`, and `pair` methods remain available for reproducibility.
          - Results distinguish exact minima, finite-domain stability, replay-verified upper bounds, and unresolved no-hit searches.
          - The package includes transparent and edgeR-backed runnable fixtures. The repository provides compact numerical evidence.
          
          The proxy is an AnnotationBreakpoint finite-change adaptation. It is not AMIP, a formal first-order edgeR influence approximation, or a reproduction of a published annotation method.
          
          ### Saved examples
          
          Under the original COMBAT CD4.TCM/CD4.NAIVE domain, 0.5 effect threshold, 445-cell global limit, and donor-level limits:
          
          - **FAM118A:** 64-cell verified upper bound; fitted effect 0.8106752561679119 to 0.4731965904097605.
          - **PDXK:** 32-cell verified upper bound; fitted effect 0.7274641768393035 to 0.3373883736018561.
          
          These are upper bounds, not certified minima. Threshold crossing does not establish a change in statistical significance, annotation truth, or biological utility.
          
          ### Evidence limits
          
          In a fixed 13-case development comparison, `proxy_prefix` found replayed witnesses in 13/13 cases and canonical greedy in 11/13, with zero greedy-only discoveries and no greedy cost advantage of at least two cells. This did not support a unique search-method contribution. The earlier scaling and public-utility conclusions remain **inconclusive**, and the Hao5P demonstration remains negative.
          
          See the [README](https://github.com/yhengaa/AnnotationBreakpoint/blob/main/README.md), [tutorial](https://github.com/yhengaa/AnnotationBreakpoint/blob/main/inst/doc/annotation-breakpoint-tutorial.md), and [evidence index](https://github.com/yhengaa/AnnotationBreakpoint/blob/main/reports/PUBLICATION/README.md).
          
          ### Requirements
          
          R 4.5.0 or later is required. The authoritative pseudobulk backend requires exactly edgeR 4.6.3. Verify `AnnotationBreakpoint_0.2.0.tar.gz` with the attached `SHA256SUMS` before installation.
          AB_RELEASE_DESCRIPTION
          gh release edit v0.2.0 --repo "$GH_REPO" --title 'Annotation Breakpoint 0.2.0' --notes-file RELEASE_BODY.md
